# Builds the Mac versions on GitHub's Macs whenever a version tag (v2.7.0 and so on) is pushed,
# and attaches them to a draft release for that tag. Publishing the release stays a person's click.
name: Mac build

on:
  push:
    # Version tags make a draft release; pushes to main just check the Mac build still works.
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon (M1 and later) and Intel Macs each need their own build.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Optional: the Google Drive client file, saved as the repository secret DRIVE_OAUTH_CLIENT.
      # Without it the Mac build still works; it just hides "Connect Google Drive".
      - name: Add the Google Drive client
        env:
          DRIVE_OAUTH_CLIENT: ${{ secrets.DRIVE_OAUTH_CLIENT }}
        run: |
          if [ -n "$DRIVE_OAUTH_CLIENT" ]; then printf '%s' "$DRIVE_OAUTH_CLIENT" > drive_oauth_client.json; fi

      # On failure, the end of the output is posted as annotations, which the run page shows
      # to anyone (the full log needs a GitHub sign-in).
      - name: Build and self-test
        run: |
          set -o pipefail
          if PYTHON=python bash build.sh 2>&1 | tee build.log; then exit 0; fi
          python - <<'EOF'
          text = open("build.log", encoding="utf-8", errors="replace").read()
          # Test failures start at the first ===== line; otherwise show the last part.
          start = text.find("=" * 70)
          text = text[start:] if start >= 0 else text[-6000:]
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:9]
          for n, chunk in enumerate(chunks, 1):
              escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Build output {n}/{len(chunks)}::{escaped}")
          EOF
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/Referral-Dash-*-Mac-*.zip
          if-no-files-found: error

  # One job attaches both ZIPs, so two builds never race to create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: zips/*.zip
